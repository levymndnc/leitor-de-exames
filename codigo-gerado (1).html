<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HemoLeitura</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#F8FAFC;color:#1E293B;max-width:430px;margin:0 auto;min-height:100vh}
.hd{background:#fff;padding:16px 20px;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center}
.hd h1{font-size:20px;color:#0EA5E9}
.sc{display:none;padding:20px;padding-bottom:80px}
.sc.active{display:block}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #E2E8F0;display:flex;justify-content:space-around;padding:12px 0;z-index:50}
.ni{background:none;border:none;cursor:pointer;font-size:12px;color:#94A3B8}
.ni.active{color:#0EA5E9;font-weight:600}
.btn{background:#0EA5E9;color:#fff;border:none;border-radius:10px;padding:16px;font-size:16px;font-weight:600;width:100%;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn2{background:#fff;color:#0EA5E9;border:1px solid #0EA5E9;border-radius:10px;padding:14px;font-size:15px;font-weight:600;width:100%;cursor:pointer;margin-top:10px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.mo.hide{display:none}
.ml{background:#fff;border-radius:20px;padding:28px 24px;max-width:380px;width:100%;text-align:center}
.ml h2{font-size:20px;margin-bottom:12px}
.ml p{font-size:14px;color:#64748B;margin-bottom:20px;line-height:1.6}
.cr{text-align:left;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.cr input{margin-top:3px;width:18px;height:18px;accent-color:#0EA5E9;cursor:pointer}
.cr label{font-size:13px;line-height:1.5;cursor:pointer}
.w{font-size:24px;font-weight:700;margin-bottom:4px}
.ws{font-size:14px;color:#64748B;margin-bottom:20px}
.st{font-size:18px;font-weight:700;margin-bottom:16px}
.copt{background:#fff;border-radius:16px;padding:22px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;display:flex;align-items:center;gap:16px;margin-bottom:14px}
.copt .ib{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#E0F2FE;flex-shrink:0}
.copt h3{font-size:16px}
.copt p{font-size:13px;color:#64748B;margin-top:2px}
.rh h2{font-size:20px;font-weight:700}
.rh .m{font-size:13px;color:#64748B;margin-top:4px;margin-bottom:20px}
.ab{background:#FEF2F2;border:1px solid #EF4444;border-radius:10px;padding:14px;margin-bottom:20px;font-size:13px}
.ab strong{color:#EF4444}
.ri{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;border-left:4px solid #E2E8F0}
.ri.sg{border-left-color:#22C55E}
.ri.sy{border-left-color:#F59E0B}
.ri.sr{border-left-color:#EF4444}
.ri .rt{display:flex;justify-content:space-between}
.ri .rn{font-size:15px;font-weight:600}
.ri .rv{font-size:15px;font-weight:700}
.ri .rf{font-size:12px;color:#94A3B8;margin-top:6px}
.sb{font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;margin-top:8px;display:inline-block}
.sbg{background:#F0FDF4;color:#22C55E}
.sby{background:#FFFBEB;color:#F59E0B}
.sbr{background:#FEF2F2;color:#EF4444}
.rd{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #E2E8F0;font-size:13px;color:#64748B;line-height:1.6}
.ri.exp .rd{display:block}
.rd h4{font-size:13px;font-weight:600;color:#1E293B;margin-bottom:4px;margin-top:10px}
.rd h4:first-child{margin-top:0}
.dp{background:#FFFBEB;border:1px solid #F59E0B;border-radius:10px;padding:14px;font-size:12px;margin:20px 0;text-align:center}
.pm{padding:14px;border-radius:10px;font-size:14px;text-align:center;margin-top:14px}
.pm.l{background:#E0F2FE;color:#0EA5E9}
.pm.s{background:#F0FDF4;color:#22C55E}
.pm.e{background:#FEF2F2;color:#EF4444}
</style>
</head>
<body>

<div class="mo" id="onb">
  <div class="ml">
    <h2>Bem-vindo ao HemoLeitura</h2>
    <p>Envie o PDF do seu exame para analise automatica.</p>
    <div class="cr">
      <input type="checkbox" id="ck">
      <label for="ck"><strong>Compreendo que este app nao substitui consulta medica.</strong> Dados protegidos pela LGPD.</label>
    </div>
    <button class="btn" id="goBtn" disabled>Comecar a usar</button>
  </div>
</div>

<header class="hd">
  <h1>HemoLeitura</h1>
  <span style="font-size:11px;background:#F0FDF4;color:#22C55E;padding:4px 10px;border-radius:20px;font-weight:600">MVP</span>
</header>

<section class="sc active" id="sc-dash">
  <div class="w">Ola</div>
  <div class="ws">Envie seu exame em PDF</div>
  <button class="btn" onclick="nav('cap')">+ Enviar exame</button>
</section>

<section class="sc" id="sc-cap">
  <div class="st">Enviar exame</div>
  <div class="copt" id="upBox">
    <div class="ib">📄</div>
    <div><h3>Upload de PDF</h3><p>Toque para selecionar</p></div>
  </div>
  <input type="file" id="pdfIn" accept="application/pdf" style="display:none">
  <div id="ps"></div>
  <button class="btn2" onclick="nav('dash')">Voltar</button>
</section>

<section class="sc" id="sc-res">
  <div class="rh">
    <h2 id="exTitle">Exame</h2>
    <div class="m" id="exMeta"></div>
  </div>
  <div id="al"></div>
  <div id="rl"></div>
  <div class="dp"><strong>Aviso:</strong> Consulte seu medico.</div>
  <button class="btn2" onclick="nav('dash')">Voltar</button>
</section>

<nav class="nav">
  <button class="ni active" data-sc="dash" onclick="nav('dash')">Inicio</button>
  <button class="ni" data-sc="cap" onclick="nav('cap')">Exame</button>
  <button class="ni" data-sc="res" onclick="nav('res')">Resultado</button>
</nav>

<script>
// ===== ONBOARDING =====
var mo = document.getElementById('onb');
var ck = document.getElementById('ck');
var gb = document.getElementById('goBtn');

ck.onchange = function() {
  gb.disabled = !ck.checked;
};

gb.onclick = function() {
  mo.classList.add('hide');
};

// ===== NAVEGACAO =====
function nav(s) {
  document.querySelectorAll('.sc').forEach(function(e) {
    e.classList.remove('active');
  });
  var t = document.getElementById('sc-' + s);
  if (t) t.classList.add('active');
  document.querySelectorAll('.ni').forEach(function(e) {
    e.classList.remove('active');
  });
  var n = document.querySelector('[data-sc="' + s + '"]');
  if (n) n.classList.add('active');
  scrollTo(0, 0);
}

function tog(e) {
  e.classList.toggle('exp');
}

// ===== UPLOAD PDF =====
var ub = document.getElementById('upBox');
var pi = document.getElementById('pdfIn');
var ps = document.getElementById('ps');

ub.onclick = function() {
  pi.click();
};

pi.onchange = function(e) {
  var f = e.target.files[0];
  if (!f) return;
  ps.innerHTML = '<div class="pm l">Lendo PDF...</div>';
  var r = new FileReader();
  r.onload = function(v) {
    ex(v.target.result);
  };
  r.readAsArrayBuffer(f);
};

// ===== EXTRACAO PDF =====
function ex(buf) {
  if (typeof pdfjsLib === 'undefined') {
    ps.innerHTML = '<div class="pm e">Erro: PDF.js nao carregou</div>';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument({ data: buf }).promise
    .then(function(pdf) {
      var arr = [];
      for (var i = 1; i <= pdf.numPages; i++) {
        arr.push(pdf.getPage(i).then(function(g) {
          return g.getTextContent().then(function(t) {
            return t.items.map(function(x) {
              return x.str;
            }).join(' ');
          });
        }));
      }
      return Promise.all(arr);
    })
    .then(function(p) {
      pa(p.join('\n'));
    })
    .catch(function(e) {
      ps.innerHTML = '<div class="pm e">Erro: ' + e.message + '</div>';
    });
}

// ===== INDICADORES (38 exames) =====
var IND = [
  {n:'Glicemia',a:['glicose','glicemia'],u:'mg/dL',r:[70,99],i:'Acucar no sangue apos jejum.',h:'Pre-diabetes ou diabetes.',l:'Hipoglicemia.'},
  {n:'Hemoglobina',a:['hemoglobina'],u:'g/dL',r:[12,15],i:'Transporta oxigenio.',h:'Desidratacao.',l:'Anemia.'},
  {n:'Hematocrito',a:['hematocrito'],u:'%',r:[36,46],i:'Globulos vermelhos no sangue.',h:'Desidratacao.',l:'Anemia.'},
  {n:'Leucocitos',a:['leucocitos','leucometria'],u:'/mm3',r:[4000,11000],i:'Globulos brancos.',h:'Infeccao.',l:'Imunidade baixa.'},
  {n:'Plaquetas',a:['plaquetas'],u:'/mm3',r:[150000,450000],i:'Coagulacao.',h:'Trombose.',l:'Sangramento.'},
  {n:'Colesterol Total',a:['colesterol total'],u:'mg/dL',r:[0,200],i:'Soma do colesterol.',h:'Risco cardio.',l:'OK.'},
  {n:'HDL',a:['colesterol hdl'],u:'mg/dL',r:[40,999],i:'Colesterol bom.',h:'Protecao.',l:'Risco.'},
  {n:'LDL',a:['colesterol ldl'],u:'mg/dL',r:[0,130],i:'Colesterol ruim.',h:'Risco cardio.',l:'OK.'},
  {n:'VLDL',a:['colesterol vldl'],u:'mg/dL',r:[0,30],i:'Colesterol VLDL.',h:'Risco cardio.',l:'OK.'},
  {n:'Triglicerides',a:['triglicerides','triglicerideos'],u:'mg/dL',r:[0,150],i:'Gordura no sangue.',h:'Risco cardio.',l:'OK.'},
  {n:'Creatinina',a:['creatinina'],u:'mg/dL',r:[0.6,1.1],i:'Funcao renal.',h:'Renal reduzida.',l:'OK.'},
  {n:'Ureia',a:['ureia'],u:'mg/dL',r:[15,48],i:'Metabolismo proteico.',h:'Problemas renais.',l:'OK.'},
  {n:'Acido Urico',a:['acido urico'],u:'mg/dL',r:[2.4,5.7],i:'Metabolismo de purinas.',h:'Gota.',l:'OK.'},
  {n:'Ferro',a:['ferro'],u:'ug/dL',r:[33,193],i:'Mineral essencial.',h:'Excesso de ferro.',l:'Deficiencia de ferro.'},
  {n:'Transferrina',a:['transferrina'],u:'mg/dL',r:[200,360],i:'Transporta ferro no sangue.',h:'Excesso de ferro.',l:'Deficiencia de ferro.'},
  {n:'Gama-GT',a:['gama glutamil transferase','gama-gt','ggt'],u:'U/L',r:[5,36],i:'Enzima hepatica.',h:'Problemas hepaticos.',l:'OK.'},
  {n:'TGO',a:['aspartato aminotransferase','tgo','ast'],u:'U/L',r:[0,32],i:'Enzima hepatica.',h:'Lesao hepatica.',l:'OK.'},
  {n:'TGP',a:['alanina aminotransferase','tgp','alt'],u:'U/L',r:[0,33],i:'Enzima hepatica.',h:'Lesao hepatica.',l:'OK.'},
  {n:'PCR',a:['proteina c reativa','pcr'],u:'mg/L',r:[0,5],i:'Marcador de inflamacao.',h:'Inflamacao ativa.',l:'OK.'},
  {n:'HbA1c',a:['hemoglobina glicada','hba1c','glicada'],u:'%',r:[0,5.7],i:'Media glicemia 3 meses.',h:'Diabetes.',l:'OK.'},
  {n:'Vitamina B12',a:['vitamina b12'],u:'pg/mL',r:[197,771],i:'Vitamina do sistema nervoso.',h:'Excesso.',l:'Deficiencia neurologica.'},
  {n:'Cortisol',a:['cortisol'],u:'ug/dL',r:[4.82,19.5],i:'Hormonio do estresse.',h:'Excesso de cortisol.',l:'Insuficiencia adrenal.'},
  {n:'Estradiol',a:['estradiol'],u:'pg/mL',r:[20,400],i:'Hormonio feminino.',h:'Excesso.',l:'Deficiencia.'},
  {n:'Ferritina',a:['ferritina'],u:'ng/mL',r:[13,150],i:'Reserva de ferro.',h:'Excesso de ferro.',l:'Deficiencia de ferro.'},
  {n:'FSH',a:['hormonio foliculo estimulante','fsh'],u:'mUI/mL',r:[1.5,12],i:'Hormonio reprodutivo.',h:'Menopausa ou falencia ovarica.',l:'Problemas reprodutivos.'},
  {n:'Insulina',a:['insulina'],u:'uU/mL',r:[2.6,24.9],i:'Hormonio que controla glicose.',h:'Resistencia a insulina.',l:'Baixa producao.'},
  {n:'LH',a:['hormonio luteinizante','lh'],u:'mIU/mL',r:[1,15],i:'Hormonio reprodutivo.',h:'Excesso.',l:'Deficiencia.'},
  {n:'Progesterona',a:['progesterona'],u:'ng/mL',r:[0.1,25],i:'Hormonio reprodutivo.',h:'Excesso.',l:'Deficiencia.'},
  {n:'Prolactina',a:['prolactina'],u:'ng/mL',r:[4.79,23.3],i:'Hormonio da lactacao.',h:'Hiperprolactinemia.',l:'Deficiencia.'},
  {n:'SDHEA',a:['sulfato de dehidroepiandrosterona','sdhea'],u:'ug/dL',r:[60.9,337],i:'Hormonio androgeno.',h:'Excesso.',l:'Deficiencia.'},
  {n:'SHBG',a:['globulina ligadora de hormonios sexuais','shbg'],u:'nmol/L',r:[20,130],i:'Proteina que liga hormonios.',h:'Excesso.',l:'Deficiencia.'},
  {n:'T4 Livre',a:['t4 - tiroxina livre','t4 livre','t4-tiroxina livre'],u:'ng/dL',r:[0.93,1.7],i:'Hormonio tireoidiano ativo.',h:'Hipertireoidismo.',l:'Hipotireoidismo.'},
  {n:'TSH',a:['hormonio tireoestimulante','tsh'],u:'uIU/mL',r:[0.27,4.2],i:'Hormonio da tireoide.',h:'Hipotireoidismo.',l:'Hipertireoidismo.'},
  {n:'Vitamina D',a:['vitamina d','vitamina d - 25 oh','25 oh'],u:'ng/mL',r:[20,60],i:'Vitamina do sol, absorcao de calcio.',h:'Excesso de calcio.',l:'Osteoporose.'},
  {n:'IgE',a:['ige','imunoglobulina e'],u:'UI/mL',r:[0,100],i:'Anticorpo de alergia.',h:'Processo alergico.',l:'OK.'},
  {n:'VCM',a:['vcm'],u:'fL',r:[80,100],i:'Volume do globulo vermelho.',h:'Macrocitose.',l:'Microcitose.'},
  {n:'HCM',a:['hcm'],u:'pg',r:[27,33],i:'Hemoglobina por globulo.',h:'Macrocitose.',l:'Anemia.'},
  {n:'RDW',a:['rdw'],u:'%',r:[11.5,14.5],i:'Variacao no tamanho dos globulos.',h:'Anisocitose.',l:'OK.'}
];

// ===== PARSE TEXTO =====
function pa(t) {
  var f = [];
  var lb = 'Laboratorio';
  var d = new Date().toLocaleDateString('pt-BR');
  var u = t.toUpperCase();

  // Detectar laboratorio
  if (u.indexOf('HAPVIDA') > -1) lb = 'Hapvida';
  if (u.indexOf('DASA') > -1) lb = 'DASA';
  if (u.indexOf('FLEURY') > -1) lb = 'Fleury';
  if (u.indexOf('HILAB') > -1) lb = 'Hilab';
  if (u.indexOf('SYNLAB') > -1) lb = 'Synlab';

  // Detectar data (procura "Emissao" primeiro)
  var dm = t.match(/Emissao[^\d]*(\d{2}\/\d{2}\/\d{4})/);
  if (dm) {
    d = dm[1];
  } else {
    dm = t.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (dm) d = dm[0];
  }

  // Buscar cada indicador no texto
  IND.forEach(function(x) {
    x.a.forEach(function(al) {
      if (f.some(function(z) { return z.n === x.n; })) return;
      // Regex SEM escape - aliases nao tem caracteres especiais
      // [^0-9]* aceita qualquer texto entre o nome e o numero
      var pat = al + '[^0-9]*([0-9]+[.,][0-9]+|[0-9]+)';
      var m = t.match(new RegExp(pat, 'i'));
      if (m) {
        var v = parseFloat(m[1].replace(',', '.'));
        if (!isNaN(v) && v > 0) {
          f.push({ n: x.n, v: v, u: x.u, r: x.r, i: x.i, h: x.h, l: x.l });
        }
      }
    });
  });

  if (!f.length) {
    ps.innerHTML = '<div class="pm e">Nenhum indicador encontrado.</div>';
    return;
  }
  ps.innerHTML = '<div class="pm s">' + f.length + ' extraidos!</div>';
  re(f, lb, d);
  setTimeout(function() { nav('res'); }, 900);
}

// ===== RENDERIZAR RESULTADOS =====
function re(f, lb, d) {
  document.getElementById('exTitle').textContent = 'Exame de Sangue';
  document.getElementById('exMeta').textContent = d + ' - ' + lb;
  var ha = false;
  var al = document.getElementById('al');
  al.innerHTML = '';
  var rl = document.getElementById('rl');
  rl.innerHTML = '';

  f.forEach(function(t) {
    var sc, bc, bt, dt;
    if (t.v < t.r[0]) {
      sc = 'sr'; bc = 'sbr'; bt = 'Abaixo'; ha = true; dt = t.l;
    } else if (t.v > t.r[1]) {
      sc = 'sr'; bc = 'sbr'; bt = 'Acima'; ha = true; dt = t.h;
    } else {
      var rg = t.r[1] - t.r[0];
      if (t.v < t.r[0] + rg * 0.1 || t.v > t.r[1] - rg * 0.1) {
        sc = 'sy'; bc = 'sby'; bt = 'Atencao'; dt = 'Proximo do limite.';
      } else {
        sc = 'sg'; bc = 'sbg'; bt = 'Normal'; dt = 'Dentro da faixa.';
      }
    }
    var e = document.createElement('div');
    e.className = 'ri ' + sc;
    e.setAttribute('onclick', 'tog(this)');
    e.innerHTML = '<div class="rt"><div class="rn">' + t.n + '</div><div class="rv">' + t.v + ' ' + t.u + '</div></div>' +
      '<div class="rf">Ref: ' + t.r[0] + ' a ' + t.r[1] + ' ' + t.u + '</div>' +
      '<span class="sb ' + bc + '">' + bt + '</span>' +
      '<div class="rd"><h4>O que e</h4><p>' + t.i + '</p><h4>Pode indicar</h4><p>' + dt + '</p></div>';
    rl.appendChild(e);
  });

  if (ha) {
    al.innerHTML = '<div class="ab"><strong>Valores alterados. Procure seu medico.</strong></div>';
  }
}
</script>
</body>
</html>
